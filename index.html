<!-- ===== Google Analytics (GA4) with EU Consent Mode v2 ===== -->
<!-- GA4 Measurement ID: G-RNLRM2K6MD (shared with the main agi999 site) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RNLRM2K6MD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // Read prior choice using the SAME key as the main site ('cookie-consent'),
  // so consent is shared across agi999 and the game subpage.
  var storedConsent = localStorage.getItem('cookie-consent');
  var consented = (storedConsent === 'accepted');
  // Consent Mode v2: deny by default; grant only when the user has accepted.
  gtag('consent', 'default', {
    ad_storage: consented ? 'granted' : 'denied',
    ad_user_data: consented ? 'granted' : 'denied',
    ad_personalization: consented ? 'granted' : 'denied',
    analytics_storage: consented ? 'granted' : 'denied',
    wait_for_update: 500
  });
  // Configure ONCE but suppress the automatic page_view — we fire exactly one
  // page_view below (or after the user accepts) to avoid double-counting.
  gtag('config', 'G-RNLRM2K6MD', { send_page_view: false });
  // Attach a stable game identifier to EVERY event so all games can be
  // segmented under the shared GA4 property. Register 'game_name' as a custom
  // dimension in GA4 Admin → Data display → Custom definitions.
  gtag('set', { 'game_name': 'arrowparty' });
  var pvFired = false;
  window.__arrowPartyFirePageView = function () {
    if (pvFired) return;
    pvFired = true;
    gtag('event', 'page_view', { page_path: location.pathname });
  };
  if (consented) window.__arrowPartyFirePageView();
</script>

<script>
  // Cookie consent: show banner on first visit, gate GA on the user's choice.
  (function(){
    var banner = document.getElementById('cookie-banner');
    var accept = document.getElementById('cookie-accept');
    var reject = document.getElementById('cookie-reject');
    var stored = localStorage.getItem('cookie-consent');
    if (!stored) { banner.hidden = false; }
    accept.addEventListener('click', function(){
      localStorage.setItem('cookie-consent', 'accepted');
      gtag('consent', 'update', {
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted',
        analytics_storage: 'granted'
      });
      if (window.__arrowPartyFirePageView) window.__arrowPartyFirePageView();
      banner.hidden = true;
    });
    reject.addEventListener('click', function(){
      localStorage.setItem('cookie-consent', 'declined');
      banner.hidden = true;
    });
  })();
</script>
